name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ]; then
            export STORE_PASSWORD="android"
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            export KEY_PASSWORD="android"
          fi
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_PATH" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=BanglaKeys, OU=Mobile, O=BanglaKeys, L=Dhaka, S=Dhaka, C=BD"
          fi
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk BanglaKeys.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk BanglaKeys.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BanglaKeys-apk
          path: BanglaKeys.apk
